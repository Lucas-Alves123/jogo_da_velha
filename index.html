<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOGO DA VELHA</title>
    <meta name="description" content="Jogo clássico. Regras simples. JavaScript puro.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <button id="theme-toggle" aria-label="Toggle dark/light mode">
                    <span class="icon-dark">Modo Escuro</span>
                    <span class="icon-light">Modo Claro</span>
                </button>
            </div>
            <h1>JOGO DA VELHA</h1>
            <p class="subtitle">Jogo clássico. Regras simples. JavaScript puro.</p>
        </header>

        <div class="scoreboard">
            <div class="score-card x-score">
                <span class="player-label">X</span>
                <span class="score-text">Vitórias: <span id="score-x">0</span></span>
            </div>
            <div class="score-card draws">
                <span class="player-label">Empates</span>
                <span class="score-text"><span id="score-draws">0</span></span>
            </div>
            <div class="score-card o-score">
                <span class="player-label">O</span>
                <span class="score-text">Vitórias: <span id="score-o">0</span></span>
            </div>
        </div>

        <main>
            <div class="turn-indicator">
                Turno: <span id="current-turn">X</span>
            </div>
            
            <div class="board" id="board" role="grid" aria-label="Tic Tac Toe Board" data-turn="X">
                <button class="cell" data-index="0" aria-label="Cell 0, empty"></button>
                <button class="cell" data-index="1" aria-label="Cell 1, empty"></button>
                <button class="cell" data-index="2" aria-label="Cell 2, empty"></button>
                <button class="cell" data-index="3" aria-label="Cell 3, empty"></button>
                <button class="cell" data-index="4" aria-label="Cell 4, empty"></button>
                <button class="cell" data-index="5" aria-label="Cell 5, empty"></button>
                <button class="cell" data-index="6" aria-label="Cell 6, empty"></button>
                <button class="cell" data-index="7" aria-label="Cell 7, empty"></button>
                <button class="cell" data-index="8" aria-label="Cell 8, empty"></button>
            </div>

            <div class="game-over-message hidden" id="game-over-message" aria-live="polite">
                <span id="result-text">X VENCEU!</span>
            </div>

            <div class="controls">
                <button id="new-game-btn" class="primary-btn">NOVO JOGO</button>
                <button id="reset-score-btn" class="secondary-btn">ZERAR PLACAR</button>
            </div>
        </main>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
